name: samvad_messenger
description: Samvad Messenger - Meaningful conversations, securely connected. संवाद.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components & Animations
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  
  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  http: ^1.2.0
  
  # Firebase
  
  # Utilities
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9
  image_picker: ^1.2.3
  file_picker: ^8.0.0
  emoji_picker_flutter: ^1.6.4
  intl: ^0.19.0
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0
  country_picker: ^2.0.28
  uuid: ^4.6.0
  path: ^1.9.1
  rxdart: ^0.28.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: 17.1.2
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/samvad_logo.png
    - assets/images/samvad_icon.png
    - assets/images/samvad_splash.png
    - assets/images/app_icon.png
