name: Samvad CI

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["firebase/**", "android-native/**", ".github/workflows/samvad-ci.yml"]
  pull_request:
    paths: ["firebase/**", "android-native/**", ".github/workflows/samvad-ci.yml"]

permissions:
  contents: read

jobs:
  firebase:
    name: Firebase rules + functions (Emulator Suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm test
      - run: npm run test:e2e:logs
      - name: Upload emulator output (for log-hygiene diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-output
          path: firebase/.tmp/emulator-output.log
          if-no-files-found: ignore

  android:
    name: Android (core tests + app build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew :core:test --stacktrace
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: samvad-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
